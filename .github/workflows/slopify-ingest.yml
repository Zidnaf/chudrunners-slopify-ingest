name: Slopify Cobalt Ingest

on:
  repository_dispatch:
    types: [slopify_ingest]

permissions:
  contents: read

concurrency:
  group: slopify-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JOB_ID: ${{ github.event.client_payload.job_id }}
      YOUTUBE_URL: ${{ github.event.client_payload.url }}
      GENRE: ${{ github.event.client_payload.genre }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      CALLBACK_TOKEN: ${{ secrets.SLOPIFY_CALLBACK_TOKEN }}

      # Optional per-instance Authorization header values.
      # Leave these secrets absent unless an instance owner gives you one.
      COBALT_BERGUNG_AUTH: ${{ secrets.COBALT_BERGUNG_AUTH }}
      COBALT_MELON_AUTH: ${{ secrets.COBALT_MELON_AUTH }}
      COBALT_MGYTR_AUTH: ${{ secrets.COBALT_MGYTR_AUTH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Slopify tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ffmpeg

      - name: Resolve through approved Cobalt pool and upload
        shell: bash
        run: |
          chmod +x scripts/slopify_ingest.sh
          scripts/slopify_ingest.sh
